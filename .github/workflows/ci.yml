name: CI-CD

on:
  push:
    branches: [version-1, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pandas scikit-learn numpy pyyaml pytest ruff
      - name: Lint (ruff)
        run: ruff check --ignore E501 src tests
      - name: Unit tests (pytest)
        run: pytest -q

  deploy:
    needs: test                                   # gate: only deploy if tests pass
    if: github.ref == 'refs/heads/version-1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                             # REQUIRED for Workload Identity
    env:
      IMAGE: us-central1-docker.pkg.dev/credit-risk-mlops-0812/mlops-docker/credit-serving
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1033916110960/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@credit-risk-mlops-0812.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev -q

      - name: Build & push image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: credit-mlops-cluster
          location: us-central1-a

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/credit-serving serving="$IMAGE:${{ github.sha }}" -n credit
          kubectl rollout status deployment/credit-serving -n credit --timeout=180s

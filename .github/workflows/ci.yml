name: CI

on:
  push:
    branches: [version-1, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas scikit-learn numpy pyyaml pytest ruff

      - name: Lint (ruff)
        run: ruff check --ignore E501 src tests

      - name: Unit tests (pytest)
        run: pytest -q

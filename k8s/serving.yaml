apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-serving
  namespace: credit
  labels: { app: credit-serving }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: credit-serving }
  template:
    metadata:
      labels: { app: credit-serving }
    spec:
      serviceAccountName: credit-ksa
      containers:
      - name: serving
        image: us-central1-docker.pkg.dev/credit-risk-mlops-0812/mlops-docker/credit-serving:latest
        ports:
        - containerPort: 8080
        env:
        - name: MODEL_GCS_URI
          value: gs://credit-risk-mlops-0812-bucket/models/credit-risk/champion/model.joblib
        - name: FEAST_REPO
          value: feature_repo
        - name: DECISION_THRESHOLD
          value: "0.5"
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits:   { cpu: "1",    memory: "1536Mi" }
        startupProbe:
          httpGet: { path: /health, port: 8080 }
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8080 }
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: credit-serving
  namespace: credit
  labels: { app: credit-serving }
spec:
  type: LoadBalancer
  selector: { app: credit-serving }
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: credit-serving
  namespace: credit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: credit-serving
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: { type: Utilization, averageUtilization: 60 }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: credit-serving
  namespace: credit
  labels: { release: kps }          # so the kps Prometheus operator selects it
spec:
  selector:
    matchLabels: { app: credit-serving }
  endpoints:
  - port: http
    path: /metrics
    interval: 15s

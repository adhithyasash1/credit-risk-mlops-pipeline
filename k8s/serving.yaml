apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-serving
  namespace: credit
  labels: { app: credit-serving }
spec:
  replicas: 2
  selector:
    matchLabels: { app: credit-serving }
  template:
    metadata:
      labels: { app: credit-serving }
    spec:
      serviceAccountName: credit-ksa          # <- Workload Identity
      containers:
      - name: serving
        image: us-central1-docker.pkg.dev/credit-risk-mlops-0812/mlops-docker/credit-serving:latest
        ports:
        - containerPort: 8080
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits:   { cpu: "1",    memory: "1536Mi" }
        startupProbe:                          # tolerate the slow first boot
          httpGet: { path: /health, port: 8080 }
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:                        # only route traffic when ready
          httpGet: { path: /health, port: 8080 }
          periodSeconds: 10
        livenessProbe:                         # restart if it wedges
          httpGet: { path: /health, port: 8080 }
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: credit-serving
  namespace: credit
spec:
  type: LoadBalancer
  selector: { app: credit-serving }
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: credit-serving
  namespace: credit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: credit-serving
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: { type: Utilization, averageUtilization: 60 }
